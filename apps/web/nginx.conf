server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass https://clearframe-api-690834564732.us-central1.run.app;
    proxy_ssl_server_name on;
    proxy_set_header Host clearframe-api-690834564732.us-central1.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE streaming support for live agent feeds
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
