[project]
name = "clearframe-adapter"
version = "0.1.0"
description = "ClearFrame Parallel adapter — one seam for every Parallel API call"
requires-python = ">=3.11"
dependencies = [
  "clearframe-contracts",
  "clearframe-runtime",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe_adapter"]

[tool.uv.sources]
clearframe-contracts = { workspace = true }
clearframe-runtime = { workspace = true }
