[project]
name = "clearframe-renderer"
version = "0.1.0"
description = "ClearFrame E&O report renderer — the ledger, rendered"
requires-python = ">=3.11"
dependencies = [
  "clearframe-contracts",
  "clearframe-runtime",
  "clearframe-ledger",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe_renderer"]

[tool.uv.sources]
clearframe-contracts = { workspace = true }
clearframe-runtime = { workspace = true }
clearframe-ledger = { workspace = true }
