[project]
name = "clearframe-runtime"
version = "0.1.0"
description = "ClearFrame runtime plane — config, event bus, state store, blob store"
requires-python = ">=3.11"
dependencies = [
  "clearframe-contracts",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-firestore>=2.16",
  "google-cloud-pubsub>=2.21",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe_runtime"]

[tool.uv.sources]
clearframe-contracts = { workspace = true }
