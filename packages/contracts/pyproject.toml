[project]
name = "clearframe-contracts"
version = "0.1.0"
description = "ClearFrame shared domain contracts — the source of truth for every shape"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe_contracts"]
