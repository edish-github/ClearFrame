[project]
name = "clearframe-orch"
version = "0.1.0"
description = "ClearFrame orchestrator — the 1st AD's runtime: dispatch, tiering, budget, challenge, delta"
requires-python = ">=3.11"
dependencies = [
  "clearframe-contracts",
  "clearframe-runtime",
  "clearframe-adapter",
  "clearframe-ledger",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearframe_orch"]

[tool.uv.sources]
clearframe-contracts = { workspace = true }
clearframe-runtime = { workspace = true }
clearframe-adapter = { workspace = true }
clearframe-ledger = { workspace = true }
